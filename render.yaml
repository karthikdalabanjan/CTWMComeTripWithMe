services:
  - type: web
    name: cometripwithme
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ALLOW_MOCK_PAYMENTS
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cometripwithme-db
          property: connectionString

databases:
  - name: cometripwithme-db
    databaseName: cometripwithme
    user: cometrip_user
    plan: free

