<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ComeTripWithMe — India's 1st Creator Tour Operator</title>
  <meta name="description" content="Creator-led curated travel itineraries, interactive live audio tour guide, spot recommendations and smart trip companion." />
  <meta name="theme-color" content="#080A0F" />
  <link rel="manifest" href="manifest.json" />

  <!-- Open Graph Meta -->
  <meta property="og:title" content="ComeTripWithMe — India's 1st Creator Tour Operator" />
  <meta property="og:description" content="Curated travel itineraries & live audio tour guide with zero tourist traps." />
  <meta property="og:image" content="https://images.unsplash.com/photo-1512343879784-a960bf40e7f2?w=1200&q=80" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="app.css" />
</head>
<body>

  <!-- Top Luxury Header Navigation -->
  <header class="top-nav">
    <div class="nav-container">
      <!-- Brand Logo -->
      <div class="brand-logo" onclick="setTab('explore')">
        <div class="brand-symbol">✦</div>
        <div>
          <div class="brand-title">COMETRIPWITHME</div>
          <div class="brand-subtitle">India's 1st Creator Tour Operator</div>
        </div>
      </div>

      <!-- Desktop Navigation Tabs -->
      <nav class="desktop-nav-tabs">
        <button class="nav-tab-btn active" data-tab="explore">
          <i data-lucide="compass" style="width: 16px; height: 16px;"></i> Explore
        </button>
        <button class="nav-tab-btn" data-tab="guide">
          <i data-lucide="headphones" style="width: 16px; height: 16px;"></i> Live Guide
        </button>
        <button class="nav-tab-btn" data-tab="proof">
          <i data-lucide="play-circle" style="width: 16px; height: 16px;"></i> Proof & Videos
        </button>
        <button class="nav-tab-btn" data-tab="planner">
          <i data-lucide="calendar" style="width: 16px; height: 16px;"></i> Custom Plan
        </button>
        <button class="nav-tab-btn" data-tab="saved">
          <i data-lucide="bookmark" style="width: 16px; height: 16px;"></i> Saved
        </button>
      </nav>

      <!-- Quick Action Buttons -->
      <div style="display: flex; align-items: center; gap: 10px;">
        <button class="wishlist-btn" onclick="openInstagram('cometriipwme')" title="Instagram">
          📸
        </button>
        <button class="btn-gold" style="padding: 8px 16px; font-size: 0.85rem;" onclick="openWhatsApp('Hey ComeTripWithMe! I want to plan a trip.')">
          WhatsApp 💬
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Mount -->
  <main class="app-container" id="main-content">
    <!-- Populated via app.js -->
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav">
    <button class="mobile-nav-item active" data-tab="explore">
      <i data-lucide="compass"></i>
      <span>Explore</span>
    </button>
    <button class="mobile-nav-item" data-tab="guide">
      <i data-lucide="headphones"></i>
      <span>Guide</span>
    </button>
    <button class="mobile-nav-item" data-tab="proof">
      <i data-lucide="play-circle"></i>
      <span>Proof</span>
    </button>
    <button class="mobile-nav-item" data-tab="planner">
      <i data-lucide="calendar"></i>
      <span>Custom</span>
    </button>
    <button class="mobile-nav-item" data-tab="saved">
      <i data-lucide="bookmark"></i>
      <span>Saved</span>
    </button>
  </nav>

  <!-- Trip Detail Modal -->
  <div class="modal-overlay" id="trip-modal" onclick="if(event.target===this) closeTripModal()">
    <div class="modal-content">
      <button class="modal-close" onclick="closeTripModal()">
        <i data-lucide="x"></i>
      </button>
      <div id="trip-modal-body"></div>
    </div>
  </div>

  <!-- Toast Notification Mount -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Application Logic -->
  <script src="trips-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
